name = "vectron-api"
main = "src/index.ts"
compatibility_date = "2026-07-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "vectron-db"
database_id = "7620e00f-6b46-46b5-989f-5c5d0e5c2d11"

[[r2_buckets]]
binding = "DATASET"
bucket_name = "vectron-dataset"

[[vectorize]]
binding = "VECTORIZE"
index_name = "vectron-concepts-m3"

[[workflows]]
name = "vectron-sync-concepts"
binding = "SYNC_WORKFLOW"
class_name = "SyncConceptsWorkflow"

[[workflows]]
name = "vectron-generate-concepts"
binding = "GENERATE_WORKFLOW"
class_name = "GenerateConceptsWorkflow"

[[workflows]]
name = "vectron-auto-grow"
binding = "AUTO_GROW_WORKFLOW"
class_name = "AutoGrowWorkflow"

[[routes]]
pattern = "vectron.kilowatto.com"
custom_domain = true

# Ciclo autónomo (pedido explícito del usuario 2026-07-22, cadence
# subida a cada 30 min el mismo día): el handler `scheduled` en
# index.ts revisa el conteo actual de conceptos contra
# TARGET_TOTAL_CONCEPTS y el presupuesto diario de IA antes de
# disparar una corrida — ver AutoGrowWorkflow.
[triggers]
crons = ["*/30 * * * *"]

[vars]
# Repo/rama/ruta donde AutoGrowWorkflow deja un commit de historial
# por cada corrida — sólo registro, el Worker desplegado no depende
# de este archivo (lee/escribe D1/Vectorize/R2 directo).
GITHUB_OWNER = "kilowatto"
GITHUB_REPO = "vectron"
GITHUB_BRANCH = "main"
GITHUB_SEED_PATH = "worker/src/data/seedConcepts.ts"
# Meta original del push de +10,000 (10,457 al empezar). El cron deja
# de disparar corridas nuevas en cuanto COUNT(*) en `concepts` alcance
# este número.
TARGET_TOTAL_CONCEPTS = "20457"
# Tope de llamadas a Workers AI por día UTC (ver migrations/0005,
# tabla ai_budget) — puramente para no llevarse una sorpresa en la
# factura si algo queda en bucle. Subido de 200 a 1000 junto con el
# cron a cada 30 min (48 corridas/día × ~6-11 llamadas/corrida) para
# que el tope no sea el cuello de botella real de la cadence nueva.
AI_DAILY_CALL_CAP = "1000"
