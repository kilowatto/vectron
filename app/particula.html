<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Vectron — laboratorio de animaciones de partículas (nacimiento/división/unión/muerte)" />
    <title>Vectron — laboratorio de partículas</title>
    <link rel="stylesheet" href="/src/particula/particula.css" />
  </head>
  <body>
    <!-- Mismo tratamiento que el canvas del cubo (ver index.html): foco
         propio para que W/A/S/D y flechas NO sean atajos globales de un
         solo carácter (WCAG 2.1.4, nivel A, se cumple por la vía "activos
         sólo con el foco puesto"), para que quien navega por teclado
         pueda ALCANZAR la escena, y para tener dónde pintar el anillo de
         foco (2.4.7). El contenido interno es el equivalente accesible
         que exige el estándar HTML para `canvas`. -->
    <canvas
      id="particula-canvas"
      tabindex="0"
      role="application"
      aria-label="Laboratorio de partículas. Usa las flechas para orbitar y acercarte."
    >
      <p id="particula-fallback">
        Laboratorio 3D de partículas. Tu navegador no puede mostrarlo.
      </p>
    </canvas>

    <div id="particula-hud">
      <span id="particula-count">1 partícula</span>
    </div>

    <!-- WCAG 2.5.7 (AA): todo lo que hoy sólo se hace arrastrando
         (orbitar, zoom) necesita alternativa sin arrastre. ≥48 px por el
         trabajo de campo sobre agarre del teléfono (~7 mm de objetivo al
         centro contra ~12 mm en las esquinas). -->
    <div id="particula-scene-controls">
      <button type="button" id="pt-zoom-out" class="scene-ctl" aria-label="Alejar">−</button>
      <button type="button" id="pt-reset-view" class="scene-ctl" aria-label="Restablecer vista">⌂</button>
      <button type="button" id="pt-zoom-in" class="scene-ctl" aria-label="Acercar">+</button>
    </div>

    <div id="particula-controls">
      <div id="particula-sheet">
        <div class="field">
          <label class="title">Partícula</label>
          <div class="segmented" id="particle-style-toggle">
            <button type="button" class="segment" data-style="hero">Hero clásica</button>
            <button type="button" class="segment" data-style="liquid">Líquida</button>
          </div>
        </div>

        <div id="liquid-section" hidden>
          <div class="field">
            <div class="field-row">
              <label class="title" for="liquid-core-slider">Líquida — núcleo (emisor)</label>
              <span class="duration-value" id="liquid-core-output">2.10</span>
            </div>
            <input type="range" id="liquid-core-slider" min="0" max="4" step="0.05" value="2.1" />
          </div>
          <div class="field">
            <div class="field-row">
              <label class="title" for="liquid-fresnel-slider">Líquida — fresnel (borde)</label>
              <span class="duration-value" id="liquid-fresnel-output">3.0</span>
            </div>
            <input type="range" id="liquid-fresnel-slider" min="1" max="6" step="0.1" value="3" />
          </div>
          <div class="field">
            <div class="field-row">
              <label class="title" for="liquid-irid-slider">Líquida — iridiscencia</label>
              <span class="duration-value" id="liquid-irid-output">0.70</span>
            </div>
            <input type="range" id="liquid-irid-slider" min="0" max="2" step="0.05" value="0.7" />
          </div>
          <div class="field">
            <div class="field-row">
              <label class="title" for="liquid-env-slider">Líquida — reflejo de entorno</label>
              <span class="duration-value" id="liquid-env-output">0.90</span>
            </div>
            <input type="range" id="liquid-env-slider" min="0" max="2" step="0.05" value="0.9" />
          </div>
          <div class="field">
            <div class="field-row">
              <label class="title" for="liquid-wobble-slider">Líquida — membrana (wobble)</label>
              <span class="duration-value" id="liquid-wobble-output">0.015</span>
            </div>
            <input type="range" id="liquid-wobble-slider" min="0" max="0.06" step="0.001" value="0.015" />
          </div>
          <div class="field">
            <div class="field-row">
              <label class="title" for="liquid-breath-slider">Líquida — respiración</label>
              <span class="duration-value" id="liquid-breath-output">0.060</span>
            </div>
            <input type="range" id="liquid-breath-slider" min="0" max="0.25" step="0.005" value="0.06" />
          </div>
        </div>

        <hr class="sheet-divider" />

        <div class="field">
          <div class="field-row">
            <label class="title" for="duration-slider">Duración de animación</label>
            <span class="duration-value" id="duration-output">1.5s</span>
          </div>
          <input type="range" id="duration-slider" min="0.1" max="10" step="0.1" value="1.5" />
        </div>

        <hr class="sheet-divider" />

        <div class="field">
          <label class="title" for="style-nacer">Estilo — Nacimiento</label>
          <select id="style-nacer"></select>
        </div>
        <div class="field">
          <label class="title" for="style-dividir">Estilo — División</label>
          <select id="style-dividir"></select>
        </div>
        <div class="field">
          <label class="title" for="style-unir">Estilo — Unión</label>
          <select id="style-unir"></select>
        </div>
        <div class="field">
          <label class="title" for="style-morir">Estilo — Muerte</label>
          <select id="style-morir"></select>
        </div>

        <hr class="sheet-divider" />

        <div class="field">
          <div class="field-row">
            <label class="title" for="movement-speed-slider">Movimiento — velocidad</label>
            <span class="duration-value" id="movement-speed-output">1.6</span>
          </div>
          <input type="range" id="movement-speed-slider" min="0" max="4" step="0.05" value="1.6" />
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="movement-intensity-slider">Movimiento — intensidad</label>
            <span class="duration-value" id="movement-intensity-output">1.4</span>
          </div>
          <input type="range" id="movement-intensity-slider" min="0" max="3" step="0.05" value="1.4" />
        </div>

        <hr class="sheet-divider" />

        <label class="checkbox-row">
          <input type="checkbox" id="connector-toggle" />
          Mostrar línea de conexión (con la más cercana)
        </label>
        <div class="field">
          <label class="title" for="style-conector">Estilo — Línea</label>
          <select id="style-conector"></select>
        </div>

        <div id="color-section" hidden>
          <hr class="sheet-divider" />
          <div class="field">
            <div class="field-row">
              <label class="title" for="color-hue-slider">Color — partícula seleccionada</label>
              <span class="duration-value" id="color-hue-output">0°</span>
            </div>
            <input type="range" id="color-hue-slider" class="hue-slider" min="0" max="360" step="1" value="0" />
          </div>
          <div class="field">
            <div class="field-row">
              <label class="title" for="color-intensity-slider">Vida — intensidad de luz propia</label>
              <span class="duration-value" id="color-intensity-output">0.22</span>
            </div>
            <input type="range" id="color-intensity-slider" min="0" max="0.8" step="0.01" value="0.22" />
          </div>
        </div>

        <hr class="sheet-divider" />

        <div class="field">
          <label class="title">Animación masiva</label>
          <div class="segmented" id="batch-mode-toggle">
            <button type="button" class="segment" data-mode="dividir">Dividir en masa</button>
            <button type="button" class="segment" data-mode="unir">Unir en masa</button>
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="batch-target-input">Cantidad objetivo</label>
            <input type="number" id="batch-target-input" class="number-input" min="2" max="25000" step="1" value="1000" />
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="batch-duration-slider">Duración por operación</label>
            <span class="duration-value" id="batch-duration-output">0.4s</span>
          </div>
          <input type="range" id="batch-duration-slider" min="0.1" max="3" step="0.05" value="0.4" />
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="batch-concurrent-slider">Simultáneas por oleada</label>
            <span class="duration-value" id="batch-concurrent-output">10</span>
          </div>
          <input type="range" id="batch-concurrent-slider" min="1" max="40" step="1" value="10" />
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="batch-stagger-slider">Retraso entre oleadas</label>
            <span class="duration-value" id="batch-stagger-output">0.15s</span>
          </div>
          <input type="range" id="batch-stagger-slider" min="0" max="2" step="0.05" value="0.15" />
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="batch-reframe-toggle" checked />
          Reencuadrar cámara automáticamente
        </label>
        <button type="button" class="secondary-btn" id="batch-start-btn">Iniciar animación masiva</button>
        <p id="batch-status" class="status-text" hidden></p>

        <hr class="sheet-divider" />

        <div class="field">
          <label class="title">Configuración</label>
          <button type="button" class="secondary-btn" id="export-config-btn">Exportar configuración (copiar JSON)</button>
        </div>
      </div>

      <div id="export-overlay" hidden>
        <div id="export-modal">
          <p id="export-hint">Se intentó copiar al portapapeles. Si no funcionó, selecciona el texto y copia manualmente.</p>
          <textarea id="export-textarea" readonly></textarea>
          <button type="button" class="secondary-btn" id="export-close-btn">Cerrar</button>
        </div>
      </div>

      <div id="particula-actions">
        <button class="pbtn" data-action="nacer"><span class="icon">🌱</span><span>Nacer</span></button>
        <button class="pbtn" data-action="dividir"><span class="icon">✂️</span><span>Dividir</span></button>
        <button class="pbtn" data-action="unir"><span class="icon">🔗</span><span>Unión</span></button>
        <button class="pbtn" data-action="morir"><span class="icon">💀</span><span>Muerte</span></button>
        <button class="pbtn" id="particula-settings-toggle"><span class="icon">⚙️</span><span>Ajustes</span></button>
      </div>
    </div>

    <script type="module" src="/src/particula/main.ts"></script>
  </body>
</html>
