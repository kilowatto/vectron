<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Vectron — laboratorio de animaciones de partículas (nacimiento/división/unión/muerte)" />
    <title>Vectron — laboratorio de partículas</title>
    <link rel="stylesheet" href="/src/particula/particula.css" />
  </head>
  <body>
    <canvas id="particula-canvas"></canvas>

    <div id="particula-hud">
      <span id="particula-count">1 partícula</span>
    </div>

    <div id="particula-controls">
      <div id="particula-sheet">
        <div class="field">
          <div class="field-row">
            <label class="title" for="duration-slider">Duración de animación</label>
            <span class="duration-value" id="duration-output">1.5s</span>
          </div>
          <input type="range" id="duration-slider" min="0.1" max="10" step="0.1" value="1.5" />
        </div>

        <hr class="sheet-divider" />

        <div class="field">
          <label class="title" for="style-nacer">Estilo — Nacimiento</label>
          <select id="style-nacer"></select>
        </div>
        <div class="field">
          <label class="title" for="style-dividir">Estilo — División</label>
          <select id="style-dividir"></select>
        </div>
        <div class="field">
          <label class="title" for="style-unir">Estilo — Unión</label>
          <select id="style-unir"></select>
        </div>
        <div class="field">
          <label class="title" for="style-morir">Estilo — Muerte</label>
          <select id="style-morir"></select>
        </div>

        <hr class="sheet-divider" />

        <label class="checkbox-row">
          <input type="checkbox" id="connector-toggle" />
          Mostrar línea de conexión (con la más cercana)
        </label>
        <div class="field">
          <label class="title" for="style-conector">Estilo — Línea</label>
          <select id="style-conector"></select>
        </div>

        <div id="color-section" hidden>
          <hr class="sheet-divider" />
          <div class="field">
            <div class="field-row">
              <label class="title" for="color-hue-slider">Color — partícula seleccionada</label>
              <span class="duration-value" id="color-hue-output">0°</span>
            </div>
            <input type="range" id="color-hue-slider" class="hue-slider" min="0" max="360" step="1" value="0" />
          </div>
          <div class="field">
            <div class="field-row">
              <label class="title" for="color-intensity-slider">Vida — intensidad de luz propia</label>
              <span class="duration-value" id="color-intensity-output">0.22</span>
            </div>
            <input type="range" id="color-intensity-slider" min="0" max="0.8" step="0.01" value="0.22" />
          </div>
        </div>

        <hr class="sheet-divider" />

        <div class="field">
          <label class="title">Configuración</label>
          <button type="button" class="secondary-btn" id="export-config-btn">Exportar configuración (copiar JSON)</button>
        </div>
      </div>

      <div id="export-overlay" hidden>
        <div id="export-modal">
          <p id="export-hint">Se intentó copiar al portapapeles. Si no funcionó, selecciona el texto y copia manualmente.</p>
          <textarea id="export-textarea" readonly></textarea>
          <button type="button" class="secondary-btn" id="export-close-btn">Cerrar</button>
        </div>
      </div>

      <div id="particula-actions">
        <button class="pbtn" data-action="nacer"><span class="icon">🌱</span><span>Nacer</span></button>
        <button class="pbtn" data-action="dividir"><span class="icon">✂️</span><span>Dividir</span></button>
        <button class="pbtn" data-action="unir"><span class="icon">🔗</span><span>Unión</span></button>
        <button class="pbtn" data-action="morir"><span class="icon">💀</span><span>Muerte</span></button>
        <button class="pbtn" id="particula-settings-toggle"><span class="icon">⚙️</span><span>Ajustes</span></button>
      </div>
    </div>

    <script type="module" src="/src/particula/main.ts"></script>
  </body>
</html>
